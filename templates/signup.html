{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up | Union</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      * { font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
    <link rel="stylesheet" href="{% static 'css/typography.css' %}" />
  </head>
  <body class="min-h-screen bg-white flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">

      <!-- Logo -->
      <div class="text-center mb-10">
        <a href="{% url 'hub:home' %}" class="inline-flex items-center gap-2">
          <span class="text-3xl font-black tracking-tight text-gray-900">Union</span>
        </a>
      </div>

      <!-- Heading -->
      <h1 class="text-2xl font-extrabold text-gray-900 text-center mb-8">Create your Union account</h1>

      <!-- Messages -->
      {% if messages %}
        <div class="mb-4 space-y-2">
          {% for message in messages %}
            <div class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'success' %}border-gray-200 bg-gray-50 text-gray-700{% else %}border-red-200 bg-red-50 text-red-700{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      <!-- Form -->
      <form id="signupForm" method="post" action="{% url 'hub:signup' %}" class="space-y-4">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}

        <div>
          <label for="full_name" class="block text-sm font-semibold text-gray-900 mb-1.5">Full Name</label>
          <input type="text" id="full_name" name="full_name" value="{{ form_data.full_name|default:'' }}" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 outline-none placeholder:text-gray-400 focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition" />
        </div>

        <div>
          <label for="username" class="block text-sm font-semibold text-gray-900 mb-1.5">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" value="{{ form_data.username|default:'' }}" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 outline-none placeholder:text-gray-400 focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition" />
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-gray-900 mb-1.5">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" value="{{ form_data.email|default:'' }}" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 outline-none placeholder:text-gray-400 focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition" />
        </div>

        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="date_of_birth" class="block text-sm font-semibold text-gray-900 mb-1.5">Date of Birth</label>
            <input type="date" id="date_of_birth" name="date_of_birth" value="{{ form_data.date_of_birth|default:'' }}" required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-500 outline-none focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition" />
          </div>
          <div>
            <label for="gender" class="block text-sm font-semibold text-gray-900 mb-1.5">Gender</label>
            <select id="gender" name="gender" required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-500 outline-none focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition">
              {% for value,label in gender_choices %}
                <option value="{{ value }}" {% if form_data.gender == value %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div>
          <label for="phone_number" class="block text-sm font-semibold text-gray-900 mb-1.5">Phone Number</label>
          <input type="tel" id="phone_number" name="phone_number" autocomplete="tel" value="{{ form_data.phone_number|default:'' }}" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 outline-none placeholder:text-gray-400 focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition" />
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-900 mb-1.5">Password</label>
          <input type="password" id="password" name="password" required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 outline-none placeholder:text-gray-400 focus:border-gray-500 focus:ring-4 focus:ring-gray-100 transition" />
        </div>

        <button type="submit" class="w-full rounded-xl bg-gradient-to-r from-blue-500 to-indigo-600 py-3.5 text-sm font-bold text-white shadow-sm transition hover:from-blue-600 hover:to-indigo-700">
          Create Account
        </button>
      </form>

      <!-- Links -->
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">Already have an account? <a href="{% url 'hub:signin' %}{% if next %}?next={{ next|urlencode }}{% endif %}" class="font-semibold text-blue-600 hover:text-blue-700">Sign in</a></p>
      </div>

      <!-- Divider -->
      <div class="my-6 flex items-center gap-3">
        <div class="flex-1 border-t border-gray-200"></div>
        <span class="text-xs font-medium text-gray-400">or</span>
        <div class="flex-1 border-t border-gray-200"></div>
      </div>

      <!-- Social Logins -->
      <div class="space-y-3">
        <button type="button"
          class="w-full flex items-center justify-center gap-3 rounded-xl border border-gray-300 bg-white py-3.5 text-sm font-semibold text-gray-700 transition hover:bg-gray-50">
          <svg class="h-5 w-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign up with Google
        </button>
        <button type="button"
          class="w-full flex items-center justify-center gap-3 rounded-xl border border-gray-300 bg-white py-3.5 text-sm font-semibold text-gray-700 transition hover:bg-gray-50">
          <i class="fa-brands fa-x-twitter text-base"></i>
          Sign up with X
        </button>
      </div>

    </div>

    <!-- Google OAuth -->
    <script src="https://accounts.google.com/gsi/client" defer></script>
    <script>
      window.onload = function () {
        if (typeof google !== "undefined" && google.accounts && google.accounts.id) {
          google.accounts.id.disableAutoSelect();
        }
      };
    </script>
  </body>
</html>
