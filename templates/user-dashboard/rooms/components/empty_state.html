<div class="rounded-2xl border border-dashed border-gray-200 bg-white px-6 py-12 text-center">
  <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-gray-100 text-gray-400"><i class="{{ icon|default:'fa-solid fa-layer-group' }} text-lg"></i></div>
  <h3 class="mt-4 text-sm font-bold text-gray-900">{{ title }}</h3>
  {% if message %}<p class="mx-auto mt-1 max-w-sm text-sm leading-6 text-gray-500">{{ message }}</p>{% endif %}
  {% if action_label %}<button type="button" class="mt-5 rounded-xl bg-gray-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-gray-800">{{ action_label }}</button>{% endif %}
</div>
