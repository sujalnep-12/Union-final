<div data-course-module data-draggable draggable="true" class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
  <div class="flex items-center gap-3 border-b border-gray-100 px-4 py-3">
    <i class="fa-solid fa-grip-vertical cursor-grab text-gray-300"></i>
    <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-amber-50 text-amber-500"><i class="fa-solid fa-folder-open text-sm"></i></span>
    <div class="min-w-0 flex-1"><input data-module-name value="Section 1: Community foundations" class="w-full bg-transparent text-sm font-bold text-gray-900 outline-none" /><p class="mt-0.5 text-[11px] text-gray-400">3 lessons - 28 min</p></div>
    <button type="button" class="rounded-lg p-2 text-gray-400 hover:bg-gray-50" title="Section options"><i class="fa-solid fa-ellipsis"></i></button>
  </div>
  <div data-lesson-list class="space-y-2 p-3">
    <article draggable="true" data-draggable class="rounded-xl border border-gray-100 bg-gray-50 p-3">
      <div class="flex flex-wrap items-center gap-3"><i class="fa-solid fa-grip-vertical cursor-grab text-gray-300"></i><span class="flex h-7 w-7 items-center justify-center rounded-lg bg-indigo-100 text-indigo-600"><i class="fa-solid fa-circle-play text-xs"></i></span><input value="Welcome and course map" class="min-w-[160px] flex-1 bg-transparent text-sm font-semibold outline-none" /><span class="text-xs text-gray-400">05:40</span><button type="button" data-access-toggle class="rounded-full bg-emerald-100 px-2 py-1 text-[10px] font-bold text-emerald-700">FREE</button><button type="button" class="text-gray-400 hover:text-gray-800" title="Lesson settings"><i class="fa-solid fa-gear text-xs"></i></button></div>
      <div class="mt-3 grid gap-2 border-t border-gray-200 pt-3 md:grid-cols-[minmax(0,1fr)_auto_auto]"><input value="A quick tour of the course and what learners will build." class="min-w-0 rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs outline-none focus:border-indigo-400" /><label class="cursor-pointer rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs font-bold text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-video mr-1 text-indigo-500"></i>Replace video<input type="file" accept="video/*" class="hidden" /></label><label class="cursor-pointer rounded-lg border border-gray-200 bg-white px-3 py-2 text-xs font-bold text-gray-600 hover:bg-gray-50"><i class="fa-solid fa-paperclip mr-1 text-amber-500"></i>Add resource<input type="file" accept=".pdf,.zip,.doc,.docx,.ppt,.pptx" class="hidden" /></label></div>
    </article>
    <article draggable="true" data-draggable class="rounded-xl border border-gray-100 bg-white p-3">
      <div class="flex flex-wrap items-center gap-3"><i class="fa-solid fa-grip-vertical cursor-grab text-gray-300"></i><span class="flex h-7 w-7 items-center justify-center rounded-lg bg-rose-50 text-rose-500"><i class="fa-solid fa-file-pdf text-xs"></i></span><input value="Community promise worksheet" class="min-w-[160px] flex-1 bg-transparent text-sm font-semibold outline-none" /><span class="text-xs text-gray-400">PDF</span><button type="button" data-access-toggle class="rounded-full bg-amber-100 px-2 py-1 text-[10px] font-bold text-amber-700">PREMIUM</button><button type="button" class="text-gray-400 hover:text-gray-800" title="Lesson settings"><i class="fa-solid fa-gear text-xs"></i></button></div>
      <p class="mt-2 border-t border-gray-100 pt-2 text-xs text-gray-500">Downloadable worksheet attached - 1.8 MB</p>
    </article>
    <button type="button" data-add-lesson class="flex w-full items-center justify-center gap-2 rounded-xl border border-dashed border-indigo-200 bg-indigo-50/50 px-3 py-2.5 text-xs font-bold text-indigo-700 transition hover:bg-indigo-50"><i class="fa-solid fa-plus"></i>Add video, article, or resource</button>
  </div>
</div>
