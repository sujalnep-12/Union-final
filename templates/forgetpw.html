{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | Union</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f5f5;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .forgot-container{
      width:100%;
      max-width:760px;
      background:#f3f3f3;
      border-radius:32px;
      padding:80px 40px;
      box-shadow:0 10px 30px rgba(0,0,0,0.08);
      text-align:center;
    }

    .brand-link{
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
      margin-bottom:28px;
      color:#6d28d9;
      text-decoration:none;
      font-weight:700;
      letter-spacing:.08em;
    }

    .brand-link img{
      width:64px;
      height:64px;
      border-radius:18px;
      object-fit:contain;
      background:#fff;
      box-shadow:0 12px 28px rgba(109,40,217,0.14);
    }

    .forgot-title{
      font-size:42px;
      font-weight:700;
      color:#2f2f3a;
      margin-bottom:12px;
    }

    .forgot-subtitle{
      color:#7a7a85;
      font-size:17px;
      margin-bottom:45px;
    }

    .form-group{
      width:100%;
      max-width:420px;
      margin:0 auto 25px;
      text-align:left;
    }

    .form-group label{
      display:block;
      margin-bottom:10px;
      color:#333;
      font-size:15px;
      font-weight:500;
    }

    .form-control{
      width:100%;
      height:58px;
      border:1px solid #d8d8df;
      border-radius:14px;
      padding:0 18px;
      font-size:16px;
      background:#fff;
      outline:none;
      transition:0.3s;
    }

    .form-control:focus{
      border-color:#7c3aed;
      box-shadow:0 0 0 4px rgba(124,58,237,0.15);
    }

    .reset-btn{
      width:100%;
      max-width:420px;
      height:58px;
      border:none;
      border-radius:14px;
      background:#6d28d9;
      color:white;
      font-size:18px;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
    }

    .reset-btn:hover{
      background:#5b21b6;
    }

    .back-login{
      margin-top:28px;
    }

    .back-login a{
      text-decoration:none;
      color:#6d28d9;
      font-size:15px;
      font-weight:500;
    }

    .message{
      width:100%;
      max-width:420px;
      margin:0 auto 20px;
      padding:14px;
      border-radius:12px;
      font-size:15px;
    }

    .success{
      background:#dcfce7;
      color:#166534;
    }

    .error{
      background:#fee2e2;
      color:#991b1b;
    }

    @media(max-width:768px){

      .forgot-container{
        padding:50px 25px;
      }

      .forgot-title{
        font-size:32px;
      }

      .forgot-subtitle{
        font-size:15px;
      }
    }
  </style>
</head>

<body>

  <div class="forgot-container">

    <a href="{% url 'hub:home' %}" class="brand-link" aria-label="Union home">
      <img src="{% static 'images/union-logo.png' %}" alt="Union logo" />
      <span>UNION</span>
    </a>

    <h1 class="forgot-title">Forgot password?</h1>

    <p class="forgot-subtitle">
      No worries, we'll send you reset instructions.
    </p>

    <!-- Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div class="message {{ message.tags }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <!-- Forgot Password Form -->
    <form method="POST" action="{% url 'hub:forgot_password' %}">

      {% csrf_token %}

      <div class="form-group">
        <label>Email</label>

        <input 
          type="email"
          name="email"
          class="form-control"
          placeholder="Email address"
          value="{{ form_data.email|default:'' }}"
          required
        />
      </div>

      <button type="submit" class="reset-btn">
        Reset Password
      </button>

    </form>

    <div class="back-login">
      <a href="{% url 'hub:signin' %}">
        Back to login
      </a>
    </div>

  </div>

</body>
</html>
