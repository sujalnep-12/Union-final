<section class="mt-8">
  <div class="mb-4 flex items-center gap-3">
    <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gray-100 text-gray-700">
      <i class="fa-solid fa-gauge-high text-sm"></i>
    </div>
    <h2 class="text-base font-bold text-gray-900">Platform Metrics</h2>
  </div>
  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    {% for stat in admin_activity %}
      <article class="rounded-xl border border-gray-200 bg-white p-4 transition hover:border-gray-300 hover:shadow-sm">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-semibold text-gray-700">{{ stat.label }}</p>
            <p class="mt-0.5 truncate text-xs text-gray-400">{{ stat.helper }}</p>
          </div>
          <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-gray-100 text-gray-600 ring-1 ring-gray-200">
            <i class="fa-solid {{ stat.icon }} text-xs"></i>
          </div>
        </div>
        <p class="mt-3 text-2xl font-bold tracking-tight text-gray-900">{{ stat.value }}</p>
      </article>
    {% endfor %}
  </div>
</section>
