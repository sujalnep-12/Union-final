<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8edf3" stroke-width="1"/></pattern></defs>
<rect width="1800" height="1200" fill="url(#grid)"/>
<style>
.e{fill:#59df91;stroke:#48c77d;stroke-width:1}.d{fill:#6e9df7;stroke:#4d78d7;stroke-width:1}.t{font:700 15px Arial;fill:#0d2b1b;text-anchor:middle}.f{font:12px Arial;fill:#183b2a}.r{font:700 13px Arial;fill:#17345c;text-anchor:middle}.c{font:700 14px Arial;fill:#1d2f45}.ln{stroke:#1d2f45;stroke-width:2;fill:none}
</style>
<text x="900" y="30" font="700 22px Arial" text-anchor="middle" fill="#19324d">COMMUNITY MANAGEMENT SYSTEM — ER DIAGRAM</text>

<!-- role entities -->
<g transform="translate(35 75)"><rect class="e" width="150" height="74"/><text x="75" y="25" class="t">OWNER</text><text x="10" y="48" class="f">PK owner_id</text><text x="10" y="65" class="f">FK user_id</text></g>
<g transform="translate(35 300)"><rect class="e" width="150" height="74"/><text x="75" y="25" class="t">ADMIN</text><text x="10" y="48" class="f">PK admin_id</text><text x="10" y="65" class="f">FK user_id</text></g>
<g transform="translate(35 525)"><rect class="e" width="150" height="74"/><text x="75" y="25" class="t">MODERATOR</text><text x="10" y="48" class="f">PK moderator_id</text><text x="10" y="65" class="f">FK user_id</text></g>
<g transform="translate(35 750)"><rect class="e" width="150" height="74"/><text x="75" y="25" class="t">USER</text><text x="10" y="48" class="f">PK user_id</text><text x="10" y="65" class="f">account/profile</text></g>

<!-- core entities -->
<g transform="translate(700 75)"><rect class="e" width="210" height="105"/><text x="105" y="25" class="t">USER</text><text x="10" y="48" class="f">PK user_id</text><text x="10" y="66" class="f">username</text><text x="10" y="84" class="f">email</text><text x="10" y="100" class="f">status</text></g>
<g transform="translate(1120 75)"><rect class="e" width="210" height="105"/><text x="105" y="25" class="t">PROFILE</text><text x="10" y="48" class="f">PK profile_id</text><text x="10" y="66" class="f">FK user_id</text><text x="10" y="84" class="f">bio, phone</text><text x="10" y="100" class="f">preferences</text></g>
<g transform="translate(700 360)"><rect class="e" width="240" height="125"/><text x="120" y="25" class="t">COMMUNITY</text><text x="10" y="48" class="f">PK community_id</text><text x="10" y="66" class="f">FK owner_id</text><text x="10" y="84" class="f">name, description</text><text x="10" y="102" class="f">visibility, rules</text><text x="10" y="120" class="f">created_at</text></g>
<g transform="translate(1090 360)"><rect class="e" width="245" height="125"/><text x="122" y="25" class="t">MEMBERSHIP</text><text x="10" y="48" class="f">PK membership_id</text><text x="10" y="66" class="f">FK user_id, community_id</text><text x="10" y="84" class="f">role, status</text><text x="10" y="102" class="f">joined_at, ban_reason</text><text x="10" y="120" class="f">nickname</text></g>
<g transform="translate(700 700)"><rect class="e" width="240" height="125"/><text x="120" y="25" class="t">POST</text><text x="10" y="48" class="f">PK post_id</text><text x="10" y="66" class="f">FK author_id, community_id</text><text x="10" y="84" class="f">title, body</text><text x="10" y="102" class="f">approval_status</text><text x="10" y="120" class="f">created_at</text></g>
<g transform="translate(1090 700)"><rect class="e" width="245" height="125"/><text x="122" y="25" class="t">COMMENT</text><text x="10" y="48" class="f">PK comment_id</text><text x="10" y="66" class="f">FK post_id, author_id</text><text x="10" y="84" class="f">FK parent_id</text><text x="10" y="102" class="f">body, is_edited</text><text x="10" y="120" class="f">created_at</text></g>
<g transform="translate(1460 700)"><rect class="e" width="245" height="125"/><text x="122" y="25" class="t">REPORT</text><text x="10" y="48" class="f">PK report_id</text><text x="10" y="66" class="f">FK reporter_id, post_id</text><text x="10" y="84" class="f">FK reviewed_by_id</text><text x="10" y="102" class="f">reason, status</text><text x="10" y="120" class="f">created_at</text></g>
<g transform="translate(250 1010)"><rect class="e" width="220" height="105"/><text x="110" y="25" class="t">EVENT</text><text x="10" y="48" class="f">PK event_id</text><text x="10" y="66" class="f">FK community_id</text><text x="10" y="84" class="f">FK organizer_id</text><text x="10" y="100" class="f">start_at, location</text></g>
<g transform="translate(690 1010)"><rect class="e" width="220" height="105"/><text x="110" y="25" class="t">COURSE</text><text x="10" y="48" class="f">PK course_id</text><text x="10" y="66" class="f">FK community_id</text><text x="10" y="84" class="f">FK instructor_id</text><text x="10" y="100" class="f">title, status</text></g>
<g transform="translate(1100 1010)"><rect class="e" width="235" height="105"/><text x="117" y="25" class="t">PAYMENT</text><text x="10" y="48" class="f">PK transaction_id</text><text x="10" y="66" class="f">FK user_id, community_id</text><text x="10" y="84" class="f">amount, provider</text><text x="10" y="100" class="f">status, paid_at</text></g>

